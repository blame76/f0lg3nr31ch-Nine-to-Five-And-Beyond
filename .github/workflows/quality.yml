name: Reader quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: test -f dist/share-preview.png
      - run: test -f dist/roman/how-to-service/index.html
      - run: test -f dist/404.html
      - run: test -f dist/llms.txt
      - run: test ! -f dist/feed.xml && test -f dist/sitemap.xml
      - run: test -f dist/.well-known/ard.json && test -f dist/.well-known/ai-catalog.json
